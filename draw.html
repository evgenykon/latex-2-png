<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рисовалка → PNG</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .checker {
    background:
      repeating-conic-gradient(#1f2937 0% 25%, #111827 0% 50%) 0 0 / 20px 20px;
  }
  canvas { touch-action: none; }
  .tool-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.375rem 0.625rem;
    font-size: 0.75rem;
    border-radius: 0.5rem;
    border: 1px solid rgb(75 85 99);
    color: rgb(229 231 235);
    background: rgb(31 41 55);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .tool-btn:hover { background: rgb(55 65 81); }
  .tool-btn.active {
    background: rgb(37 99 235);
    border-color: rgb(59 130 246);
    color: #fff;
  }
  .tool-btn:disabled { opacity: .4; cursor: not-allowed; }
  .swatch {
    width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid rgb(75 85 99); cursor: pointer; position: relative;
  }
  .swatch.active { outline: 2px solid rgb(59 130 246); outline-offset: 1px; }
  .sep { width: 1px; align-self: stretch; background: rgb(75 85 99); }
</style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased flex flex-col min-h-screen">

  <header class="px-4 py-3 flex items-center justify-between border-b border-gray-800">
    <h1 class="text-lg font-semibold">Рисовалка → PNG</h1>
    <div class="flex gap-3 text-xs">
      <a href="./index.html" class="text-gray-400 hover:text-gray-200 underline">LaTeX → PNG</a>
      <a href="./plot.html" class="text-gray-400 hover:text-gray-200 underline">График функции</a>
    </div>
  </header>

  <div class="bg-gray-900 border-b border-gray-800 px-4 py-3">
    <div class="flex flex-wrap items-center gap-x-5 gap-y-3">

      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-400">Кисть</span>
        <div id="tools" class="flex gap-1.5">
          <button class="tool-btn active" data-tool="pen">Перо</button>
          <button class="tool-btn" data-tool="marker">Маркер</button>
          <button class="tool-btn" data-tool="brush">Кисть</button>
          <button class="tool-btn" data-tool="eraser">Ластик</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-400">Толщина</span>
        <input type="range" id="size" min="1" max="100" value="8" class="w-28 accent-blue-500">
        <span id="sizeLabel" class="text-xs text-gray-400 w-8">8</span>
      </div>

      <div class="flex items-center gap-1.5">
        <span class="text-xs text-gray-400 mr-0.5">Цвет</span>
        <input type="color" id="color" value="#f97316" class="h-8 w-10 p-0.5 bg-gray-800 border border-gray-600 rounded-md cursor-pointer">
        <div class="flex flex-wrap gap-1.5">
          <div data-color="#f97316" class="swatch active" style="background:#f97316"></div>
          <div data-color="#f87171" class="swatch" style="background:#f87171"></div>
          <div data-color="#4ade80" class="swatch" style="background:#4ade80"></div>
          <div data-color="#facc15" class="swatch" style="background:#facc15"></div>
          <div data-color="#c084fc" class="swatch" style="background:#c084fc"></div>
          <div data-color="#fb923c" class="swatch" style="background:#fb923c"></div>
          <div data-color="#f9fafb" class="swatch" style="background:#f9fafb"></div>
          <div data-color="#111827" class="swatch" style="background:#111827"></div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-400">Фон</span>
        <label class="flex items-center gap-1.5 text-xs">
          <input type="checkbox" id="transparentBg" checked class="accent-blue-500">
          Прозрачный
        </label>
        <input type="color" id="bgColor" value="#ffffff" class="h-8 w-10 p-0.5 bg-gray-800 border border-gray-600 rounded-md cursor-pointer">
      </div>

      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-400">Высота</span>
        <input type="number" id="canvasH" value="700" min="64" max="4096" step="16" class="w-20 p-1 bg-gray-800 border border-gray-600 rounded-md text-xs text-gray-100">
        <span class="text-xs text-gray-600">px</span>
      </div>

      <div class="sep"></div>

      <button class="tool-btn" id="undoBtn" disabled>Отменить</button>
      <button class="tool-btn" id="clearBtn">Очистить</button>

      <div class="flex-1"></div>

      <label class="flex items-center gap-1.5 text-xs text-gray-400">
        Масштаб PNG
        <select id="scale" class="px-1.5 py-1 bg-gray-800 border border-gray-600 rounded-md text-xs text-gray-100">
          <option value="1">×1</option>
          <option value="2" selected>×2</option>
          <option value="3">×3</option>
          <option value="4">×4</option>
        </select>
      </label>
      <button id="generate" class="px-6 py-2.5 text-sm font-medium bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 disabled:cursor-not-allowed text-white rounded-md">Скачать PNG</button>
    </div>
    <div id="status" class="text-xs text-gray-500 mt-2 min-h-[1rem]"></div>
  </div>

  <main class="checker flex-grow relative overflow-hidden">
    <div id="canvasBox" class="relative">
      <canvas id="bgCanvas" class="absolute inset-0 pointer-events-none"></canvas>
      <canvas id="drawCanvas" class="relative block"></canvas>
    </div>
  </main>

<script type="module">
(function () {
  function $ (id) { return document.getElementById(id); }

  var statusEl = $('status');
  var generateBtn = $('generate');
  var drawCanvas = $('drawCanvas');

  var LOADER = [
    'https://cdn.jsdelivr.net/npm/perfect-freehand@1.2.2/dist/esm/index.js',
    'https://unpkg.com/perfect-freehand@1.2.2/dist/esm/index.js'
  ];

  function loadGetStroke() {
    var chain = Promise.reject(new Error('start'));
    LOADER.forEach(function (u) {
      chain = chain.catch(function () {
        return import(u).then(function (m) {
          if (typeof m.getStroke !== 'function') throw new Error('bad module: ' + u);
          return m.getStroke;
        });
      });
    });
    return chain;
  }

  loadGetStroke().then(function (getStroke) {
    setup(getStroke);
  }, function (err) {
    statusEl.textContent = 'Не удалось загрузить perfect-freehand';
    drawCanvas.style.pointerEvents = 'none';
    generateBtn.disabled = true;
  });

  function setup(getStroke) {

  var bgCanvas = $('bgCanvas');
  var bgCtx = bgCanvas.getContext('2d');
  var ctx = drawCanvas.getContext('2d');

  var transparentBg = $('transparentBg');
  var bgColor = $('bgColor');
  var color = $('color');
  var size = $('size');
  var sizeLabel = $('sizeLabel');
  var tools = $('tools');
  var undoBtn = $('undoBtn');
  var clearBtn = $('clearBtn');
  var scaleSel = $('scale');
  var canvasH = $('canvasH');
  var canvasBox = $('canvasBox');

  var tool = 'pen';
  var drawing = false;
  var undoStack = [];
  var MAX_UNDO = 12;
  var dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  var cssW = 0, cssH = 700;
  var bgLayer = null;
  var strokeBase = document.createElement('canvas');
  var strokePoints = null;
  var strokeWidth = 8;

  function debounce(fn, ms) {
    var t = null;
    return function () {
      clearTimeout(t);
      t = setTimeout(fn, ms);
    };
  }

  function resize(w, h) {
    var old = document.createElement('canvas');
    old.width = drawCanvas.width;
    old.height = drawCanvas.height;
    if (old.width && old.height) old.getContext('2d').drawImage(drawCanvas, 0, 0);

    cssW = w; cssH = h;
    bgCanvas.width = drawCanvas.width = Math.round(w * dpr);
    bgCanvas.height = drawCanvas.height = Math.round(h * dpr);
    bgCanvas.style.width = drawCanvas.style.width = w + 'px';
    bgCanvas.style.height = drawCanvas.style.height = h + 'px';
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    undoStack = [];
    undoBtn.disabled = true;
    if (old.width) ctx.drawImage(old, 0, 0);
    paintBg();
  }

  function applyHeight() {
    var h = Math.round(parseFloat(canvasH.value)) || 700;
    h = Math.max(64, Math.min(4096, h));
    canvasH.value = h;
    resize(Math.max(64, canvasBox.clientWidth), h);
  }

  function hexToRgba(hex, a) {
    var v = hex.replace('#', '');
    if (v.length === 3) v = v.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(v, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function paintBg() {
    var w = drawCanvas.width, h = drawCanvas.height;
    if (transparentBg.checked) {
      bgLayer = null;
      bgCtx.clearRect(0, 0, w, h);
      return;
    }
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    var g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = bgColor.value;
    g.fillRect(0, 0, w / dpr, h / dpr);
    bgLayer = c;
    bgCtx.clearRect(0, 0, w, h);
    bgCtx.drawImage(c, 0, 0);
  }

  function syncBg() {
    var t = transparentBg.checked;
    bgColor.disabled = t;
    bgColor.style.opacity = t ? 0.4 : 1;
    paintBg();
  }

  function syncColor() {
    document.querySelectorAll('.swatch').forEach(function (s) {
      s.classList.toggle('active', s.getAttribute('data-color') === color.value);
    });
  }

  size.addEventListener('input', function () { sizeLabel.textContent = size.value; });
  color.addEventListener('input', syncColor);
  bgColor.addEventListener('input', paintBg);
  transparentBg.addEventListener('change', syncBg);
  canvasH.addEventListener('change', applyHeight);
  window.addEventListener('resize', debounce(applyHeight, 150));

  document.querySelectorAll('.swatch').forEach(function (s) {
    s.addEventListener('click', function () {
      color.value = s.getAttribute('data-color');
      syncColor();
    });
  });

  tools.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tool]');
    if (!btn) return;
    tool = btn.getAttribute('data-tool');
    tools.querySelectorAll('[data-tool]').forEach(function (b) {
      b.classList.toggle('active', b === btn);
    });
  });

  function canvasPos(e) {
    var rect = drawCanvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width * cssW,
      y: (e.clientY - rect.top) / rect.height * cssH
    };
  }

  function pressOf(e) {
    if (e.pointerType === 'pen' && e.pressure > 0) return e.pressure;
    return 0.5;
  }

  function strokeOptions(t, last) {
    var o = {
      size: Number(size.value),
      simulatePressure: true,
      streamline: 0.4,
      smoothing: 0.5,
      last: !!last
    };
    if (t === 'marker') { o.thinning = 0.3; o.smoothing = 0.6; o.streamline = 0.6; }
    if (t === 'brush')  { o.thinning = 0.6; o.smoothing = 0.6; o.streamline = 0.3; }
    if (t === 'eraser') { o.thinning = 0; }
    return o;
  }

  function fillStyleFor(t) {
    if (t === 'marker') return hexToRgba(color.value, 0.35);
    if (t === 'eraser') return '#000';
    return color.value;
  }

  function paintStroke(points, t, last) {
    var w = Number(size.value);
    if (points.length < 2) {
      ctx.globalCompositeOperation = t === 'eraser' ? 'destination-out' : 'source-over';
      ctx.fillStyle = fillStyleFor(t);
      ctx.beginPath();
      ctx.arc(points[0][0], points[0][1], Math.max(0.5, w / 2), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      return;
    }
    var outline = getStroke(points, strokeOptions(t, last));
    if (!outline || !outline.length) return;
    var path = new Path2D();
    path.moveTo(outline[0][0], outline[0][1]);
    for (var i = 1; i < outline.length; i++) path.lineTo(outline[i][0], outline[i][1]);
    path.closePath();
    ctx.globalCompositeOperation = t === 'eraser' ? 'destination-out' : 'source-over';
    ctx.fillStyle = fillStyleFor(t);
    ctx.fill(path);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function redrawStroke() {
    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    ctx.drawImage(strokeBase, 0, 0);
    paintStroke(strokePoints, tool, false);
  }

  function beginStroke(e) {
    e.preventDefault();
    drawCanvas.setPointerCapture(e.pointerId);
    drawing = true;
    var p = canvasPos(e);
    pushUndo();

    strokeBase.width = drawCanvas.width;
    strokeBase.height = drawCanvas.height;
    strokeBase.getContext('2d').drawImage(drawCanvas, 0, 0);
    strokePoints = [[p.x, p.y, pressOf(e)]];
    strokeWidth = Number(size.value);
    paintStroke(strokePoints, tool, false);
  }

  function moveStroke(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = canvasPos(e);
    var last = strokePoints[strokePoints.length - 1];
    if (Math.hypot(p.x - last[0], p.y - last[1]) < 0.5) return;
    strokePoints.push([p.x, p.y, pressOf(e)]);
    if (strokePoints.length > 200) {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      ctx.drawImage(strokeBase, 0, 0);
      var im = ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
      paintStroke(strokePoints, tool, false);
      var g = im.data;
      strokeBase.width = drawCanvas.width;
      strokeBase.height = drawCanvas.height;
      strokeBase.getContext('2d').drawImage(drawCanvas, 0, 0);
      strokePoints = strokePoints.slice(100);
    }
    paintStroke(strokePoints, tool, false);
    ctx.globalCompositeOperation = 'source-over';
  }

  function endStroke(e) {
    if (!drawing) return;
    drawing = false;
    if (strokePoints && strokePoints.length) {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      ctx.drawImage(strokeBase, 0, 0);
      paintStroke(strokePoints, tool, true);
    }
    strokePoints = null;
  }

  drawCanvas.addEventListener('pointerdown', beginStroke);
  drawCanvas.addEventListener('pointermove', moveStroke);
  drawCanvas.addEventListener('pointerup', endStroke);
  drawCanvas.addEventListener('pointercancel', endStroke);
  drawCanvas.addEventListener('pointerleave', endStroke);

  function pushUndo() {
    undoStack.push(ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    undoBtn.disabled = false;
  }

  undoBtn.addEventListener('click', function () {
    var img = undoStack.pop();
    if (img) {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      ctx.putImageData(img, 0, 0);
    }
    undoBtn.disabled = undoStack.length === 0;
  });

  clearBtn.addEventListener('click', function () {
    pushUndo();
    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  });

  generateBtn.addEventListener('click', function () {
    var img = ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
    var data = img.data;
    var minX = drawCanvas.width, minY = drawCanvas.height, maxX = -1, maxY = -1;
    for (var y = 0; y < drawCanvas.height; y++) {
      var row = y * drawCanvas.width;
      for (var x = 0; x < drawCanvas.width; x++) {
        if (data[(row + x) * 4 + 3] > 0) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) { statusEl.textContent = 'Нарисуйте что-нибудь сначала'; return; }

    var pad = Math.round(16 * dpr);
    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);
    maxX = Math.min(drawCanvas.width - 1, maxX + pad);
    maxY = Math.min(drawCanvas.height - 1, maxY + pad);
    var w = maxX - minX + 1;
    var h = maxY - minY + 1;

    var sc = Math.max(1, parseInt(scaleSel.value, 10) || 1);
    var out = document.createElement('canvas');
    out.width = w * sc;
    out.height = h * sc;
    var g = out.getContext('2d');
    if (bgLayer) {
      g.drawImage(bgLayer, minX, minY, w, h, 0, 0, w * sc, h * sc);
    }
    g.drawImage(drawCanvas, minX, minY, w, h, 0, 0, w * sc, h * sc);
    var a = document.createElement('a');
    a.download = 'drawing.png';
    a.href = out.toDataURL('image/png');
    a.click();
    statusEl.textContent = 'PNG сохранён: ' + (w * sc) + ' × ' + (h * sc) + ' px (по границам рисунка)' + (transparentBg.checked ? ', фон прозрачный' : '');
  });

  applyHeight();
  syncBg();
  syncColor();
  }

})();
</script>
</body>
</html>
